# Keeps every consumer of a kind of release on its latest release: `art`
# (AnkiQuest-Art, pin file ankiquest-art.json) or `rules` (AnkiQuest-Server's
# shared rules, pin file ankiquest-rules.json). Each consumer listed for the
# kind in release-consumers.json carries the release's pin file at its root.
# Where it differs from the release's, the job pushes branch <kind>-release
# there with only that file replaced and opens (or updates) one pull request.
#
# Called by art.yml and rules.yml. tools/release-pin holds the logic: the
# latest tag, checking the pin file against the release's SHA256SUMS,
# comparing and the pull request text.
#
# FORK_SYNC_TOKEN: see sync.yml; it also needs Contents and Pull requests read
# and write on every repository in release-consumers.json.
name: Pin releases

on:
  workflow_call:
    inputs:
      kind:
        description: "art or rules"
        type: string
        required: true
      tag:
        description: "Release to pin; empty for the latest"
        type: string
        default: ""
      dispatched:
        description: "The tag a release dispatch named, if any"
        type: string
        default: ""
    secrets:
      FORK_SYNC_TOKEN:
        required: true

permissions:
  contents: read

# pipefail: a failed release listing must not read as "no release yet".
defaults:
  run:
    shell: bash

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      KIND: ${{ inputs.kind }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of sync.yml)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release-pin
        run: |
          cargo build -q --locked --release --manifest-path tools/release-pin/Cargo.toml
          echo "$PWD/tools/release-pin/target/release" >> "$GITHUB_PATH"

      # tag: the requested release; otherwise the latest, at least the dispatched one
      - name: Find the release
        id: release
        env:
          REQUESTED: ${{ inputs.tag }}
          DISPATCHED: ${{ inputs.dispatched }}
        run: |
          publisher=$(release-pin "$KIND" repo)
          if [ -n "$REQUESTED" ]; then
            tag=$(release-pin "$KIND" tag "$REQUESTED")
          else
            tag=$(gh api --paginate "repos/$publisher/releases" | release-pin "$KIND" latest "$DISPATCHED")
          fi
          if [ -z "$tag" ]; then
            echo "$publisher has no $KIND release yet" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "tag=$tag"
            echo "publisher=$publisher"
            echo "file=$(release-pin "$KIND" file)"
          } >> "$GITHUB_OUTPUT"

      - name: Download and check the pin file
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PUBLISHER: ${{ steps.release.outputs.publisher }}
          FILE: ${{ steps.release.outputs.file }}
        run: |
          gh release download "$TAG" --repo "$PUBLISHER" --dir release \
            --pattern "$FILE" --pattern SHA256SUMS
          release-pin "$KIND" verify "release/$FILE" release/SHA256SUMS "$TAG"

      - name: Open the pull requests
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE: ${{ steps.release.outputs.file }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          new="$PWD/release/$FILE"
          head="$KIND-release"
          failed=0

          for repo in $(jq -r --arg kind "$KIND" '.[$kind][]' release-consumers.json); do
            branch=$(gh api "repos/$repo" --jq .default_branch)

            # Only the pin file is needed: a shallow, sparse, blob-less clone
            dir="work/${repo#*/}"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$branch" "https://github.com/$repo.git" "$dir"
            git -C "$dir" sparse-checkout set --no-cone "/$FILE"
            old="$dir/$FILE"

            if [ "$(release-pin "$KIND" status "$new" "$old")" = current ]; then
              echo "$repo: on $TAG" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            title=$(release-pin "$KIND" title "$new")
            body=$(release-pin "$KIND" body "$new" "$old")

            # Add to the open pull request, or start the branch afresh from the default branch
            open=$(gh api "repos/$repo/pulls?head=AnkiQuest:$head&base=$branch&state=open" --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              git -C "$dir" fetch -q --depth 1 origin "$head"
              git -C "$dir" checkout -q -B "$head" FETCH_HEAD
            else
              git -C "$dir" push -q origin --delete "$head" 2>/dev/null || true
              git -C "$dir" checkout -q -b "$head"
            fi
            cp "$new" "$old"
            git -C "$dir" add "$FILE"
            if ! git -C "$dir" diff --cached --quiet; then
              git -C "$dir" commit -q -m "$title" -m "The pin file of $(release-pin "$KIND" repo) release $TAG."
              if ! git -C "$dir" push -q origin "$head"; then
                echo "::error::$repo: push failed"; failed=1; continue
              fi
            fi

            # The title and body follow the newest release
            if [ -n "$open" ]; then
              gh api -X PATCH "repos/$repo/pulls/$open" -f title="$title" -f body="$body" --silent
              echo "$repo: updated pull request #$open to $TAG" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            url=$(gh api "repos/$repo/pulls" --jq .html_url \
              -f base="$branch" -f head="$head" -f title="$title" -f body="$body")
            echo "$repo: opened $url" >> "$GITHUB_STEP_SUMMARY"
          done

          exit $failed
