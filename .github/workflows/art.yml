# Keeps every consumer of AnkiQuest-Art on its latest release. Each consumer
# in art-consumers.json carries the release's pin file, ankiquest-art.json, at
# its root. Where it differs from the release's, the job pushes branch
# art-release there with only that file replaced and opens (or updates) one
# pull request, "Use AnkiQuest-Art <tag>".
#
# Runs on the `art-released` repository_dispatch that AnkiQuest-Art's release
# workflow sends (client payload {"tag": "art-<N>"}), daily as a fallback, and
# on demand with an optional tag (empty: the latest release).
#
# tools/art-pin holds the logic: the latest tag, checking the pin file
# against the release's SHA256SUMS, comparing and the pull request text.
#
# FORK_SYNC_TOKEN: see sync.yml; it also needs Contents and Pull requests read
# and write on every repository in art-consumers.json.
name: Pin AnkiQuest-Art releases

on:
  repository_dispatch:
    types: [art-released]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to pin (art-<N>); empty for the latest"
        type: string
        default: ""

permissions:
  contents: read

# pipefail: a failed release listing must not read as "no release yet".
defaults:
  run:
    shell: bash

# One writer at a time; a run is never cancelled.
concurrency:
  group: art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of sync.yml)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build art-pin
        run: |
          cargo build -q --locked --release --manifest-path tools/art-pin/Cargo.toml
          echo "$PWD/tools/art-pin/target/release" >> "$GITHUB_PATH"

      # tag: the requested release; otherwise the latest, at least the dispatched one
      - name: Find the release
        id: release
        env:
          REQUESTED: ${{ inputs.tag }}
          DISPATCHED: ${{ github.event.client_payload.tag }}
        run: |
          if [ -n "$REQUESTED" ]; then
            tag=$(art-pin tag "$REQUESTED")
          else
            tag=$(gh api --paginate repos/AnkiQuest/AnkiQuest-Art/releases | art-pin latest "$DISPATCHED")
          fi
          if [ -z "$tag" ]; then
            echo "AnkiQuest-Art has no art-* release yet" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and check the pin file
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo AnkiQuest/AnkiQuest-Art --dir release \
            --pattern ankiquest-art.json --pattern SHA256SUMS
          art-pin verify release/ankiquest-art.json release/SHA256SUMS "$TAG"

      - name: Open the pull requests
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          new="$PWD/release/ankiquest-art.json"
          failed=0

          for repo in $(jq -r '.[]' art-consumers.json); do
            branch=$(gh api "repos/$repo" --jq .default_branch)

            # Only the pin file is needed: a shallow, sparse, blob-less clone
            dir="work/${repo#*/}"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$branch" "https://github.com/$repo.git" "$dir"
            git -C "$dir" sparse-checkout set --no-cone /ankiquest-art.json
            old="$dir/ankiquest-art.json"

            if [ "$(art-pin status "$new" "$old")" = current ]; then
              echo "$repo: on $TAG" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            title=$(art-pin title "$new")
            body=$(art-pin body "$new" "$old")

            # Add to the open pull request, or start art-release afresh from the branch
            open=$(gh api "repos/$repo/pulls?head=AnkiQuest:art-release&base=$branch&state=open" --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              git -C "$dir" fetch -q --depth 1 origin art-release
              git -C "$dir" checkout -q -B art-release FETCH_HEAD
            else
              git -C "$dir" push -q origin --delete art-release 2>/dev/null || true
              git -C "$dir" checkout -q -b art-release
            fi
            cp "$new" "$old"
            git -C "$dir" add ankiquest-art.json
            if ! git -C "$dir" diff --cached --quiet; then
              git -C "$dir" commit -q -m "$title" -m "The pin file of AnkiQuest/AnkiQuest-Art release $TAG."
              if ! git -C "$dir" push -q origin art-release; then
                echo "::error::$repo: push failed"; failed=1; continue
              fi
            fi

            # The title and body follow the newest release
            if [ -n "$open" ]; then
              gh api -X PATCH "repos/$repo/pulls/$open" -f title="$title" -f body="$body" --silent
              echo "$repo: updated pull request #$open to $TAG" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            url=$(gh api "repos/$repo/pulls" --jq .html_url \
              -f base="$branch" -f head=art-release -f title="$title" -f body="$body")
            echo "$repo: opened $url" >> "$GITHUB_STEP_SUMMARY"
          done

          exit $failed
