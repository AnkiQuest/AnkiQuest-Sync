# Keeps every consumer of AnkiQuest-Art on its latest release: one pull
# request per consumer, "chore(art): use AnkiQuest-Art <tag>", replacing its
# ankiquest-art.json (pins.yml does the work).
#
# Runs on the `art-released` repository_dispatch that AnkiQuest-Art's release
# workflow sends (client payload {"tag": "art-<N>"}), daily as a fallback, and
# on demand with an optional tag (empty: the latest release).
name: Pin AnkiQuest-Art releases

on:
  repository_dispatch:
    types: [art-released]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to pin (art-<N>); empty for the latest"
        type: string
        default: ""

permissions:
  contents: read

# One writer at a time; a run is never cancelled.
concurrency:
  group: art
  cancel-in-progress: false

jobs:
  art:
    uses: ./.github/workflows/pins.yml
    with:
      kind: art
      tag: ${{ inputs.tag || '' }}
      dispatched: ${{ github.event.client_payload.tag || '' }}
    secrets:
      FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
