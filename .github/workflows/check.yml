# Lints and audits the workflows, checks the flake and tests the tools on pull
# requests and on master, with AnkiQuest-Dev's shared Nix check.
name: Check

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to a pull request replaces its run; pushes to master and merge
# queue entries each keep theirs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed. Nothing below reads the
  # Markdown or licence texts, so a docs-only change skips the check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # code-changed lists the pull request's files
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@master

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      # The flake's checks include the formatting.
      format: ""
      actionlint: true
      zizmor: true
      run: |
        jq empty watched.json art-consumers.json forks.json
        for tool in tools/art-pin tools/fork-sync tools/source-watch; do
          (
            cd "$tool"
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo test --locked
          )
        done
      timeout-minutes: 20
