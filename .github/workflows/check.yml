# Lints the workflows, checks the flake and tests tools/art-pin on pull
# requests and on master, with AnkiQuest-Dev's shared Nix check.
name: Check

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      # The flake's checks include the formatting.
      format: ""
      actionlint: true
      run: |
        jq empty watched.json art-consumers.json
        cd tools/art-pin
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked
      timeout-minutes: 20
