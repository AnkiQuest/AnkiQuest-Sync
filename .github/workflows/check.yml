# Lints the workflows and checks the flake on pull requests and on master,
# with AnkiQuest-Dev's shared Nix check.
name: Check

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/nix-check.yml@master
    with:
      # The flake's checks include the formatting.
      format: ""
      actionlint: true
      run: jq empty watched.json
      timeout-minutes: 10
