# Keeps AnkiQuest's forks up to date with their upstream repositories and
# the other sources they carry.
#
# sync (forks.json, and watched.json entries in mode "merge"): each fork's
# default branch carries upstream plus our changes. The job merges
# upstream's branch into sync/<owner>/<repo> on the fork (a watched source's
# into sync/<owner>/<repo>-<ref>) and opens one pull request from it,
# "chore(sync): merge upstream <owner>/<repo> at <commit>"; later runs add
# merges to the same branch and update that pull request. A conflict never
# stops the merge: files are committed with their markers and submodules
# keep our commit, and the pull request lists what is left, so people fix it
# on the branch. In an upstream merge, AGENTS.md and CLAUDE.md are written
# from AnkiQuest-Agents and the merged upstream's own CLAUDE.md and
# AGENTS.md (the "Upstream guidance" section, introduced by upstream.md), so
# a change to upstream's guidance arrives in this pull request; the agents
# job writes the same section once it is merged. A watched source's merge
# keeps the fork's AGENTS.md. Merge it with a merge commit, outside the merge queue,
# so the fork keeps the source's history. Once merged, the source's commits
# are in the fork's branch and the next run finds nothing new: there is no
# `reviewed` to move. tools/fork-sync holds the merge, tools/source-watch
# the matrix.
#
# watch (watched.json): the other entries, by mode. "pin": a dependency
# pinned by commit in the target's Cargo.toml; the job opens one pull
# request moving the pin to the source's head, from sync/<owner>/<repo>-<ref>,
# and the pin in the target's default branch is what is reviewed. "port":
# changes that need a person (a different codebase, or a release step); one
# open issue in the fork it feeds (in AnkiQuest-Sync, titled with the fork,
# where the fork has issues disabled), closed once `reviewed` is updated.
# tools/source-watch holds the logic.
#
# mirror (mirrors.json): branches of ours that mirror a source branch, such
# as AnkiQuest-Android's upstream-main (ankidroid/Anki-Android main). Each is
# pushed to the source's commit directly, without a pull request; a default
# branch is never one. The push is never forced: if the source was
# force-pushed or someone pushed to the mirror, the job fails and the branch
# stays as it is. tools/source-watch holds the logic.
#
# FORK_SYNC_TOKEN: fine-grained token for the AnkiQuest organisation with Contents,
# Workflows, Pull requests and Issues read and write on every fork, and Contents
# read on AnkiQuest-Agents. GITHUB_TOKEN can't be used: it cannot write to other
# repositories, cannot push upstream commits that change workflows, and pull requests
# it opens start no CI. The mirror job pushes with the same Contents and
# Workflows write on each mirror's target (a fork).
name: Sync forks with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run at a time, never cancelled: two runs would both open pull requests
# or issues. A newer run waits for the running one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The matrix: forks.json (shared with agents.yml) and the merged sources
  # of watched.json
  forks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          cargo build -q --locked --release --manifest-path tools/source-watch/Cargo.toml
          echo "list=$(tools/source-watch/target/release/source-watch matrix forks.json watched.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: forks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.forks.outputs.list) }}
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORK: ${{ matrix.fork }}
      UPSTREAM: ${{ matrix.upstream }}
      UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
      SYNC: ${{ matrix.branch }}
      GUIDANCE: ${{ matrix.guidance }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      # BRANCH: the fork's default branch, read rather than assumed.
      # OPEN: the open sync pull request, if any.
      - name: Find the fork's branches
        run: |
          echo "BRANCH=$(gh api "repos/$FORK" --jq .default_branch)" >> "$GITHUB_ENV"
          open=$(gh api "repos/$FORK/pulls?head=${FORK%%/*}:$SYNC&state=open" --jq '.[0].number // empty')
          echo "OPEN=$open" >> "$GITHUB_ENV"

      # upstream_new: upstream commits the sync branch (or, without an open
      # pull request, the fork's branch) lacks. Cheap, so quiet days clone
      # nothing. A source outside the fork's network can't be compared here
      # ("unknown"); the merge then finds out, and does nothing when it has
      # nothing new.
      - name: Compare with upstream
        id: compare
        run: |
          head="$BRANCH"
          if [ -n "$OPEN" ]; then
            head="$SYNC"
          fi
          ahead=$(gh api "repos/$FORK/compare/$head...${UPSTREAM%%/*}:$UPSTREAM_BRANCH" --jq .ahead_by) || ahead=unknown
          echo "upstream_new=$ahead" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          path: sync
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          repository: AnkiQuest/AnkiQuest-Agents
          path: agents
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          repository: ${{ matrix.fork }}
          ref: ${{ env.BRANCH }}
          path: fork
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0
          # The merge step pushes the sync branch to the fork with this
          # token. No later step runs code from the fork or upstream.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Build fork-sync
        if: steps.compare.outputs.upstream_new != '0'
        run: |
          cargo build -q --locked --release --manifest-path sync/tools/fork-sync/Cargo.toml
          echo "$PWD/sync/tools/fork-sync/target/release" >> "$GITHUB_PATH"

      # The open pull request's branch gets the new merge on top; without one,
      # the branch starts again from the fork's branch.
      - name: Merge upstream into the sync branch
        id: merge
        if: steps.compare.outputs.upstream_new != '0'
        working-directory: fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream_ref="refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch -q --no-tags "https://github.com/$UPSTREAM.git" "+$UPSTREAM_BRANCH:$upstream_ref"
          if [ -n "$OPEN" ]; then
            git fetch -q origin "+$SYNC:refs/remotes/origin/$SYNC"
            git checkout -q -B "$SYNC" "refs/remotes/origin/$SYNC"
          else
            git push -q origin --delete "$SYNC" 2>/dev/null || true
            git checkout -q -B "$SYNC" "$BRANCH"
          fi

          # A watched source is not the fork's upstream: AGENTS.md stays as is
          if [ "$GUIDANCE" = keep ]; then
            git show "$BRANCH:AGENTS.md" > ../agents.md
          else
            section="../agents/repos/${FORK#*/}.md"
            if [ ! -f "$section" ]; then
              echo "::error::$FORK has no section in AnkiQuest-Agents (repos/${FORK#*/}.md)"
              exit 1
            fi
            fork-sync guidance "$upstream_ref" ../guidance
            fork-sync agents ../agents/shared.md "$section" upstream ../agents/upstream.md "$UPSTREAM" ../guidance > ../agents.md
          fi
          result=$(fork-sync merge "$upstream_ref" "$UPSTREAM" ../agents.md)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          if [ "$result" = merged ]; then
            git push -q origin "$SYNC"
          fi

      - name: Open or update the pull request
        if: steps.merge.outputs.result == 'merged'
        working-directory: fork
        env:
          UPSTREAM_REF: ${{ steps.merge.outputs.upstream_ref }}
        run: |
          title=$(fork-sync title "$UPSTREAM" "$(git rev-parse "$UPSTREAM_REF")")
          body=$(fork-sync body "$UPSTREAM" "$UPSTREAM_BRANCH" "$BRANCH" "$UPSTREAM_REF" "$SYNC")
          conflicts=false
          if grep -q '^## Conflicts$' <<<"$body"; then
            conflicts=true
            echo "::warning::$UPSTREAM conflicts with $FORK; see the pull request"
          fi

          if [ -n "$OPEN" ]; then
            gh api -X PATCH "repos/$FORK/pulls/$OPEN" -f title="$title" -f body="$body" --silent
            echo "$FORK: updated pull request #$OPEN ($title)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A conflicting merge starts as a draft until someone resolves it
          url=$(gh api "repos/$FORK/pulls" --jq .html_url \
            -f base="$BRANCH" -f head="$SYNC" -f title="$title" -f body="$body" -F draft="$conflicts")
          echo "$FORK: opened $url" >> "$GITHUB_STEP_SUMMARY"

  watch:
    runs-on: ubuntu-latest
    # A pin bump clones the target and installs its Rust toolchain
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # issues for targets with issues disabled go here
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FALLBACK_TOKEN: ${{ github.token }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source-watch
        run: |
          cargo build -q --locked --release --manifest-path tools/source-watch/Cargo.toml
          echo "$PWD/tools/source-watch/target/release" >> "$GITHUB_PATH"

      # A pull request per pinned source and an issue per ported one; every
      # source is checked even when one fails, and the step fails at the end
      # naming the failed ones. Pins are moved in a clone the tool makes;
      # git authenticates with GH_TOKEN through gh.
      - name: Act on watched sources
        run: |
          gh auth setup-git
          source-watch report watched.json "$GITHUB_REPOSITORY" "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/watch"

  mirror:
    runs-on: ubuntu-latest
    # A first run fetches the source's whole history
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source-watch
        run: |
          cargo build -q --locked --release --manifest-path tools/source-watch/Cargo.toml
          echo "$PWD/tools/source-watch/target/release" >> "$GITHUB_PATH"

      # git authenticates with GH_TOKEN through gh
      - name: Move the mirrors
        run: |
          gh auth setup-git
          source-watch mirror mirrors.json https://github.com "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/mirror"
