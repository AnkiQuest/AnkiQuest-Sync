# Keeps AnkiQuest's forks up to date with their upstream repositories.
#
# sync (forks.json): each fork's default branch carries upstream plus our
# changes. The job merges upstream's branch into sync/<owner>/<repo> on the
# fork and opens one pull request from it, "chore(sync): merge upstream
# <owner>/<repo> at <commit>"; later runs add merges to the same branch and
# update that pull request. A conflict never stops the merge: files are
# committed with their markers and submodules keep our commit, and the
# pull request lists what is left, so people fix it on the branch. In the
# merge, AGENTS.md and CLAUDE.md are written from AnkiQuest-Agents and the
# merged upstream's own CLAUDE.md and AGENTS.md (the "Upstream guidance"
# section), so a change to upstream's guidance arrives in this pull request.
# Merge it with a merge commit, outside the merge queue, so the fork keeps
# upstream's history. tools/fork-sync holds the logic.
#
# watch (watched.json): other sources our branches carry changes from (FSRS-7, kuma3, a
# new upstream backend version). Their changes need porting by hand, so each source with
# commits (or a version) newer than its `reviewed` value gets one open issue in the fork
# it feeds; the issue closes once `reviewed` is updated. They get no merge pull
# request: our branches carry them as rewritten commits, not their history, so a
# merge would bring every commit again.
#
# FORK_SYNC_TOKEN: fine-grained token for the AnkiQuest organisation with Contents,
# Workflows, Pull requests and Issues read and write on every fork below, and Contents
# read on AnkiQuest-Agents. GITHUB_TOKEN can't be used: it cannot write to other
# repositories, cannot push upstream commits that change workflows, and pull requests
# it opens start no CI.
name: Sync forks with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One run at a time, never cancelled: two runs would both open pull requests
# or issues. A newer run waits for the running one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The matrix: forks.json, shared with agents.yml
  forks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "list=$(jq -c . forks.json)" >> "$GITHUB_OUTPUT"

  sync:
    needs: forks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.forks.outputs.list) }}
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORK: ${{ matrix.fork }}
      UPSTREAM: ${{ matrix.upstream }}
      UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
      SYNC: sync/${{ matrix.upstream }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      # BRANCH: the fork's default branch, read rather than assumed.
      # OPEN: the open sync pull request, if any.
      - name: Find the fork's branches
        run: |
          echo "BRANCH=$(gh api "repos/$FORK" --jq .default_branch)" >> "$GITHUB_ENV"
          open=$(gh api "repos/$FORK/pulls?head=${FORK%%/*}:$SYNC&state=open" --jq '.[0].number // empty')
          echo "OPEN=$open" >> "$GITHUB_ENV"

      # upstream_new: upstream commits the sync branch (or, without an open
      # pull request, the fork's branch) lacks. Cheap, so quiet days clone nothing.
      - name: Compare with upstream
        id: compare
        run: |
          head="$BRANCH"
          if [ -n "$OPEN" ]; then
            head="$SYNC"
          fi
          echo "upstream_new=$(gh api "repos/$FORK/compare/$head...${UPSTREAM%%/*}:$UPSTREAM_BRANCH" --jq .ahead_by)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          path: sync
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          repository: AnkiQuest/AnkiQuest-Agents
          path: agents
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          repository: ${{ matrix.fork }}
          ref: ${{ env.BRANCH }}
          path: fork
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0
          # The merge step pushes the sync branch to the fork with this
          # token. No later step runs code from the fork or upstream.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Build fork-sync
        if: steps.compare.outputs.upstream_new != '0'
        run: |
          cargo build -q --locked --release --manifest-path sync/tools/fork-sync/Cargo.toml
          echo "$PWD/sync/tools/fork-sync/target/release" >> "$GITHUB_PATH"

      # The open pull request's branch gets the new merge on top; without one,
      # the branch starts again from the fork's branch.
      - name: Merge upstream into the sync branch
        id: merge
        if: steps.compare.outputs.upstream_new != '0'
        working-directory: fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream_ref="refs/remotes/upstream/$UPSTREAM_BRANCH"
          git fetch -q --no-tags "https://github.com/$UPSTREAM.git" "+$UPSTREAM_BRANCH:$upstream_ref"
          if [ -n "$OPEN" ]; then
            git fetch -q origin "+$SYNC:refs/remotes/origin/$SYNC"
            git checkout -q -B "$SYNC" "refs/remotes/origin/$SYNC"
          else
            git push -q origin --delete "$SYNC" 2>/dev/null || true
            git checkout -q -B "$SYNC" "$BRANCH"
          fi

          section="../agents/repos/${FORK#*/}.md"
          if [ ! -f "$section" ]; then
            echo "::error::$FORK has no section in AnkiQuest-Agents (repos/${FORK#*/}.md)"
            exit 1
          fi
          fork-sync guidance "$upstream_ref" ../guidance
          fork-sync agents ../agents/shared.md "$section" upstream "$UPSTREAM" ../guidance > ../agents.md
          result=$(fork-sync merge "$upstream_ref" "$UPSTREAM" ../agents.md)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"
          if [ "$result" = merged ]; then
            git push -q origin "$SYNC"
          fi

      - name: Open or update the pull request
        if: steps.merge.outputs.result == 'merged'
        working-directory: fork
        env:
          UPSTREAM_REF: ${{ steps.merge.outputs.upstream_ref }}
        run: |
          title=$(fork-sync title "$UPSTREAM" "$(git rev-parse "$UPSTREAM_REF")")
          body=$(fork-sync body "$UPSTREAM" "$UPSTREAM_BRANCH" "$BRANCH" "$UPSTREAM_REF")
          conflicts=false
          if grep -q '^## Conflicts$' <<<"$body"; then
            conflicts=true
            echo "::warning::$UPSTREAM conflicts with $FORK; see the pull request"
          fi

          if [ -n "$OPEN" ]; then
            gh api -X PATCH "repos/$FORK/pulls/$OPEN" -f title="$title" -f body="$body" --silent
            echo "$FORK: updated pull request #$OPEN ($title)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A conflicting merge starts as a draft until someone resolves it
          url=$(gh api "repos/$FORK/pulls" --jq .html_url \
            -f base="$BRANCH" -f head="$SYNC" -f title="$title" -f body="$body" -F draft="$conflicts")
          echo "$FORK: opened $url" >> "$GITHUB_STEP_SUMMARY"

  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One issue per source, titled by source; updated while new, closed once reviewed
      - name: Report new changes in watched sources
        run: |
          failed=0
          while IFS= read -r entry; do
            get() { jq -r ".$1 // empty" <<<"$entry"; }
            source=$(get source); ref=$(get ref); kind=$(get kind); target=$(get target)
            why=$(get why); reviewed=$(get reviewed)
            title="New upstream changes: $source $ref"

            # Current state of the source: a commit for branches, a version string for versions
            if [ "$kind" = "version" ]; then
              file=$(get file); key=$(get key)
              current=$(gh api "repos/$source/contents/$file?ref=$ref" --jq .content | base64 -d | sed -n "s/^$key=//p" | head -1)
            else
              current=$(gh api "repos/$source/commits/$ref" --jq .sha)
            fi
            if [ -z "$current" ]; then
              echo "::error::could not read $source $ref"
              failed=1
              continue
            fi

            open=$(gh issue list --repo "$target" --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -1)

            # Reviewed: close a leftover issue
            if [ "$current" = "$reviewed" ]; then
              if [ -n "$open" ]; then
                gh issue close "$open" --repo "$target" --comment "Reviewed up to $current in AnkiQuest/AnkiQuest-Sync watched.json."
              fi
              echo "$source $ref: nothing new" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "$kind" = "version" ]; then
              details="Upstream version is now \`$current\` (reviewed: \`$reviewed\`)."
            else
              cmp=$(gh api "repos/$source/compare/$reviewed...$current")
              count=$(jq .total_commits <<<"$cmp")
              list=$(jq -r '.commits[-50:][] | "- \(.sha[0:10]) \(.commit.message | split("\n")[0])"' <<<"$cmp")
              details="$count new commits since \`${reviewed:0:10}\` (latest 50 below): https://github.com/$source/compare/$reviewed...$current

          $list"
            fi
            body="Source: https://github.com/$source ($ref). Why we watch it: $why.

          $details

          Port what we need (or decide to skip it), then set \`reviewed\` for this source in AnkiQuest/AnkiQuest-Sync \`watched.json\` to \`$current\`. This issue closes on the next run.

          Opened by AnkiQuest/AnkiQuest-Sync."
            if [ -n "$open" ]; then
              gh issue edit "$open" --repo "$target" --body "$body"
            else
              gh issue create --repo "$target" --title "$title" --body "$body"
            fi
            echo "$source $ref: new ($current), reported in $target" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' watched.json)
          exit "$failed"
