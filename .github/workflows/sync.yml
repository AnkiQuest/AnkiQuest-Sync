# Keeps AnkiQuest's forks up to date with their upstream repositories.
#
# Each fork's master carries upstream plus our changes. A pull request from upstream's
# default branch into master is opened (or kept open); it lists conflicting files. Merge
# it with a merge commit so the fork keeps upstream's history.
#
# watch (watched.json): other sources our branches carry changes from (FSRS-7, kuma3, a
# new upstream backend version). Their changes need porting by hand, so each source with
# commits (or a version) newer than its `reviewed` value gets one open issue in the fork
# it feeds; the issue closes once `reviewed` is updated.
#
# FORK_SYNC_TOKEN: fine-grained token for the AnkiQuest organisation with Contents,
# Workflows, Pull requests and Issues read and write on every fork below. GITHUB_TOKEN
# can't be used: it cannot write to other repositories, cannot push upstream commits
# that change workflows, and pull requests it opens start no CI.
name: Sync forks with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fork: AnkiQuest/AnkiQuest-Android, upstream: ankidroid/Anki-Android, upstream_branch: main }
          - { fork: AnkiQuest/AnkiQuest-Anki, upstream: ankitects/anki, upstream_branch: main }
          - { fork: AnkiQuest/AnkiQuest-Android-Backend, upstream: ankidroid/Anki-Android-Backend, upstream_branch: main }
          - { fork: AnkiQuest/AnkiQuest-GarmAnki, upstream: sypianski/garmanki, upstream_branch: master }
          - { fork: AnkiQuest/AnkiQuest-Android-MCP, upstream: ankimcp/ankidroid-mcp, upstream_branch: main }
          - { fork: AnkiQuest/AnkiQuest-AnkiConnectAndroid, upstream: KamWithK/AnkiconnectAndroid, upstream_branch: master }
    concurrency:
      group: sync-${{ matrix.fork }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORK: ${{ matrix.fork }}
      BRANCH: master
      UPSTREAM: ${{ matrix.upstream }}
      UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      # upstream_new: upstream commits the fork lacks
      - name: Compare with upstream
        id: compare
        run: |
          owner="${UPSTREAM%%/*}"
          echo "upstream_new=$(gh api "repos/$FORK/compare/$BRANCH...$owner:$UPSTREAM_BRANCH" --jq .ahead_by)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.compare.outputs.upstream_new != '0'
        with:
          repository: ${{ matrix.fork }}
          ref: master
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Open the upstream pull request
        if: steps.compare.outputs.upstream_new != '0'
        env:
          UPSTREAM_NEW: ${{ steps.compare.outputs.upstream_new }}
        run: |
          owner="${UPSTREAM%%/*}"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"

          # Try the merge here so a conflict is reported by file, not only on the pull request page
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          conflicts=""
          if ! git merge --no-commit --no-ff "refs/remotes/upstream/$UPSTREAM_BRANCH"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            [ -n "$conflicts" ] || conflicts="(the trial merge failed without listing files; see the log)"
          fi
          git merge --abort 2>/dev/null || true
          if [ -n "$conflicts" ]; then
            echo "::warning::$UPSTREAM conflicts with $FORK in: $(echo "$conflicts" | paste -sd ' ')"
            { echo "### $UPSTREAM conflicts with $FORK $BRANCH"; echo; while IFS= read -r file; do echo "- $file"; done <<<"$conflicts"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$FORK: $UPSTREAM_NEW upstream commits merge cleanly" >> "$GITHUB_STEP_SUMMARY"
          fi

          open=$(gh api "repos/$FORK/pulls?head=$owner:$UPSTREAM_BRANCH&base=$BRANCH&state=open" --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Pull request #$open is open and now includes the new commits"
            exit 0
          fi
          gh api "repos/$FORK/pulls" --jq .html_url \
            -f base="$BRANCH" -f head="$owner:$UPSTREAM_BRANCH" \
            -f title="Merge upstream $UPSTREAM" \
            -f body="$UPSTREAM_NEW new commits from $UPSTREAM $UPSTREAM_BRANCH.

          Merge with a merge commit, never squash or rebase, so $BRANCH keeps upstream's history.

          If this conflicts, merge $UPSTREAM $UPSTREAM_BRANCH into a branch from $BRANCH, resolve there, and merge that branch instead; this pull request then shows as merged.

          Opened by AnkiQuest/AnkiQuest-Sync."

  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One issue per source, titled by source; updated while new, closed once reviewed
      - name: Report new changes in watched sources
        run: |
          failed=0
          while IFS= read -r entry; do
            get() { jq -r ".$1 // empty" <<<"$entry"; }
            source=$(get source); ref=$(get ref); kind=$(get kind); target=$(get target)
            why=$(get why); reviewed=$(get reviewed)
            title="New upstream changes: $source $ref"

            # Current state of the source: a commit for branches, a version string for versions
            if [ "$kind" = "version" ]; then
              file=$(get file); key=$(get key)
              current=$(gh api "repos/$source/contents/$file?ref=$ref" --jq .content | base64 -d | sed -n "s/^$key=//p" | head -1)
            else
              current=$(gh api "repos/$source/commits/$ref" --jq .sha)
            fi
            if [ -z "$current" ]; then
              echo "::error::could not read $source $ref"
              failed=1
              continue
            fi

            open=$(gh issue list --repo "$target" --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -1)

            # Reviewed: close a leftover issue
            if [ "$current" = "$reviewed" ]; then
              if [ -n "$open" ]; then
                gh issue close "$open" --repo "$target" --comment "Reviewed up to $current in AnkiQuest/AnkiQuest-Sync watched.json."
              fi
              echo "$source $ref: nothing new" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if [ "$kind" = "version" ]; then
              details="Upstream version is now \`$current\` (reviewed: \`$reviewed\`)."
            else
              cmp=$(gh api "repos/$source/compare/$reviewed...$current")
              count=$(jq .total_commits <<<"$cmp")
              list=$(jq -r '.commits[-50:][] | "- \(.sha[0:10]) \(.commit.message | split("\n")[0])"' <<<"$cmp")
              details="$count new commits since \`${reviewed:0:10}\` (latest 50 below): https://github.com/$source/compare/$reviewed...$current

          $list"
            fi
            body="Source: https://github.com/$source ($ref). Why we watch it: $why.

          $details

          Port what we need (or decide to skip it), then set \`reviewed\` for this source in AnkiQuest/AnkiQuest-Sync \`watched.json\` to \`$current\`. This issue closes on the next run.

          Opened by AnkiQuest/AnkiQuest-Sync."
            if [ -n "$open" ]; then
              gh issue edit "$open" --repo "$target" --body "$body"
            else
              gh issue create --repo "$target" --title "$title" --body "$body"
            fi
            echo "$source $ref: new ($current), reported in $target" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c '.[]' watched.json)
          exit "$failed"
