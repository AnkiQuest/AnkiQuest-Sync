# Writes each AnkiQuest repository's AGENTS.md from AnkiQuest/AnkiQuest-Agents:
# shared.md, a blank line, repos/<repository>.md. A fork's AGENTS.md then carries
# its upstream's own guidance (CLAUDE.md, or AGENTS.md where CLAUDE.md only points
# at it) under an "Upstream guidance" heading, so upstream's rules are kept and
# tracked, not overwritten: when upstream edits its file, the next run takes the
# new text along in the same pull request. CLAUDE.md becomes "@AGENTS.md" in
# every repository (the upstream text lives in AGENTS.md now). Where either file
# differs from the repository's branch, the job pushes branch agents-sync there
# and opens (or updates) one pull request.
#
# TARGETS: the repositories; AGENTS.md lives on each one's default branch.
# UPSTREAMS: a fork's upstream, whose guidance is appended; forks whose upstream
# has no guidance file of its own are left out.
#
# FORK_SYNC_TOKEN: see sync.yml; it also needs Contents and Pull requests read and
# write on every repository in TARGETS, and Contents read on AnkiQuest-Agents.
#
# The per-repository logic is shell glue; if it grows, move it to a Rust tool here.
name: Distribute AGENTS.md

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [agents-changed]

permissions:
  contents: read

concurrency:
  group: agents
  cancel-in-progress: false

env:
  TARGETS: |
    [
      "AnkiQuest/AnkiQuest-Server",
      "AnkiQuest/AnkiQuest-Desktop",
      "AnkiQuest/AnkiQuest-Android",
      "AnkiQuest/AnkiQuest-Anki",
      "AnkiQuest/AnkiQuest-Android-Backend",
      "AnkiQuest/AnkiQuest-GarmAnki",
      "AnkiQuest/AnkiQuest-Android-MCP",
      "AnkiQuest/AnkiQuest-AnkiConnectAndroid",
      "AnkiQuest/AnkiQuest-Dev",
      "AnkiQuest/AnkiQuest-Hosting",
      "AnkiQuest/AnkiQuest-Sync",
      "AnkiQuest/AnkiQuest-Agents",
      "AnkiQuest/AnkiQuest-Art",
      "AnkiQuest/AnkiQuest.github.io"
    ]

  # A fork's upstream: its own guidance (CLAUDE.md, or AGENTS.md) is appended to
  # the fork's AGENTS.md when it exists; an upstream without a guidance file
  # contributes nothing. Reuse the list in sync.yml's matrix, whose "upstream"
  # these must mirror.
  UPSTREAMS: |
    {
      "AnkiQuest/AnkiQuest-Anki": "ankitects/anki",
      "AnkiQuest/AnkiQuest-Android": "ankidroid/Anki-Android",
      "AnkiQuest/AnkiQuest-Android-Backend": "ankidroid/Anki-Android-Backend",
      "AnkiQuest/AnkiQuest-GarmAnki": "sypianski/garmanki",
      "AnkiQuest/AnkiQuest-Android-MCP": "ankimcp/ankidroid-mcp",
      "AnkiQuest/AnkiQuest-AnkiConnectAndroid": "KamWithK/AnkiconnectAndroid"
    }

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of sync.yml)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Agents
          path: source
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: false

      - name: Open the pull requests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          source_sha=$(git -C source rev-parse HEAD)
          failed=0

          for repo in $(jq -r '.[]' <<<"$TARGETS"); do
            branch=$(gh api "repos/$repo" --jq .default_branch)
            section="source/repos/${repo#*/}.md"
            if [ ! -f "$section" ]; then
              echo "::error::$repo has no $section"; failed=1; continue
            fi

            # Only AGENTS.md and CLAUDE.md are needed: a shallow, sparse, blob-less clone
            dir="work/${repo#*/}"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$branch" "https://github.com/$repo.git" "$dir"
            git -C "$dir" sparse-checkout set --no-cone /AGENTS.md /CLAUDE.md

            { cat source/shared.md; echo; cat "$section"; } > agents.md

            # The fork's upstream keeps its own guidance inside AGENTS.md: take
            # CLAUDE.md, or AGENTS.md where CLAUDE.md only points at it, and skip
            # indirection files (a first line of "@..."). An upstream with neither
            # contributes nothing, and any change to its wording lands in the next
            # agents-sync pull request.
            upstream=$(jq -r --arg repo "$repo" '.[$repo] // empty' <<<"$UPSTREAMS")
            if [ -n "$upstream" ]; then
              for path in CLAUDE.md AGENTS.md; do
                text=$(gh api "repos/$upstream/contents/$path" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d || true)
                # Missing, or a file that only points at another ("@..."): try the next.
                skipped=$(head -n1 <<<"$text")
                if [ -z "$text" ] || [ "${skipped#@}" != "$skipped" ]; then
                  continue
                fi
                {
                  echo
                  echo "## Upstream guidance"
                  echo
                  echo "From [$upstream](https://github.com/$upstream)'s $path, kept here so the fork still follows the originating project's own rules where AnkiQuest's do not override them; this job refreshes the wording when upstream changes it."
                  echo
                  printf '%s\n' "$text"
                } >> agents.md
                break
              done
            fi

            echo "@AGENTS.md" > claude.md

            # A symlinked AGENTS.md (upstream Anki links it to CLAUDE.md) counts as different
            if [ ! -L "$dir/AGENTS.md" ] && cmp -s agents.md "$dir/AGENTS.md" && cmp -s claude.md "$dir/CLAUDE.md"; then
              echo "$repo: up to date"; continue
            fi

            # Add to the open pull request, or start agents-sync afresh from the branch
            open=$(gh api "repos/$repo/pulls?head=AnkiQuest:agents-sync&base=$branch&state=open" --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              git -C "$dir" fetch -q --depth 1 origin agents-sync
              git -C "$dir" checkout -q -B agents-sync FETCH_HEAD
            else
              git -C "$dir" push -q origin --delete agents-sync 2>/dev/null || true
              git -C "$dir" checkout -q -b agents-sync
            fi
            rm -f "$dir/AGENTS.md"
            cp agents.md "$dir/AGENTS.md"
            cp claude.md "$dir/CLAUDE.md"
            git -C "$dir" add AGENTS.md CLAUDE.md
            if git -C "$dir" diff --cached --quiet; then
              echo "$repo: pull request #$open is up to date"; continue
            fi
            git -C "$dir" commit -q -m "Update AGENTS.md from AnkiQuest-Agents" \
              -m "Generated from AnkiQuest/AnkiQuest-Agents $source_sha: shared.md and repos/${repo#*/}.md."
            if ! git -C "$dir" push -q origin agents-sync; then
              echo "::error::$repo: push failed"; failed=1; continue
            fi

            if [ -n "$open" ]; then
              echo "$repo: updated pull request #$open" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            url=$(gh api "repos/$repo/pulls" --jq .html_url \
              -f base="$branch" -f head=agents-sync \
              -f title="Update AGENTS.md from AnkiQuest-Agents" \
              -f body="Generated from AnkiQuest/AnkiQuest-Agents $source_sha. Change the rules there, not here: shared.md for all repositories, repos/${repo#*/}.md for this one.

          Opened by AnkiQuest/AnkiQuest-Sync.")
            echo "$repo: opened $url" >> "$GITHUB_STEP_SUMMARY"
          done

          exit $failed
