# Writes each AnkiQuest repository's AGENTS.md from AnkiQuest/AnkiQuest-Agents:
# shared.md, a blank line, repos/<repository>.md. A fork's AGENTS.md ends with
# an "Upstream guidance" section, upstream's own CLAUDE.md and AGENTS.md; the
# sync job (sync.yml) writes it when it merges upstream, and this job keeps it
# as the repository's branch has it, so the two jobs never change the same
# text. CLAUDE.md is "@AGENTS.md" in every repository. Where either file
# differs from the repository's branch, the job commits both and pushes the
# commit to that branch as a fast-forward: the rules were reviewed in
# AnkiQuest-Agents, and the token's account bypasses the branch's ruleset.
# A refused push is tried once more on the latest branch; refused again, the
# commit goes to branch agents-sync and one pull request with auto-merge on,
# and the job summary says so. Nothing is force-pushed. `source-watch land`
# does this.
#
# TARGETS: the repositories; AGENTS.md lives on each one's default branch.
# tools/fork-sync writes the file (`fork-sync agents ... keep`).
#
# FORK_SYNC_TOKEN: see sync.yml; it also needs Contents and Pull requests read and
# write on every repository in TARGETS (Pull requests write for the fallback
# and its auto-merge), and Contents read on AnkiQuest-Agents. Its account is
# a bypass actor of each TARGETS repository's default-branch ruleset.
name: Distribute AGENTS.md

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [agents-changed]

permissions:
  contents: read

concurrency:
  group: agents
  cancel-in-progress: false

env:
  TARGETS: |
    [
      "AnkiQuest/AnkiQuest-Server",
      "AnkiQuest/AnkiQuest-Desktop",
      "AnkiQuest/AnkiQuest-Android",
      "AnkiQuest/AnkiQuest-Anki",
      "AnkiQuest/AnkiQuest-Android-Backend",
      "AnkiQuest/AnkiQuest-GarmAnki",
      "AnkiQuest/AnkiQuest-Android-MCP",
      "AnkiQuest/AnkiQuest-AnkiConnectAndroid",
      "AnkiQuest/AnkiQuest-Dev",
      "AnkiQuest/AnkiQuest-Hosting",
      "AnkiQuest/AnkiQuest-Sync",
      "AnkiQuest/AnkiQuest-Agents",
      "AnkiQuest/AnkiQuest-Art",
      "AnkiQuest/AnkiQuest.github.io"
    ]

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set FORK_SYNC_TOKEN (see the comment at the top of sync.yml)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Agents
          path: source
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sync
          persist-credentials: false

      - name: Build fork-sync and source-watch
        run: |
          cargo build -q --locked --release --manifest-path sync/tools/fork-sync/Cargo.toml
          cargo build -q --locked --release --manifest-path sync/tools/source-watch/Cargo.toml
          echo "$PWD/sync/tools/fork-sync/target/release" >> "$GITHUB_PATH"
          echo "$PWD/sync/tools/source-watch/target/release" >> "$GITHUB_PATH"

      # source-watch land pushes to the default branch, or falls back to the
      # agents-sync pull request with auto-merge; git authenticates through gh
      - name: Land the updates
        run: |
          gh auth setup-git
          source_sha=$(git -C source rev-parse HEAD)
          title="chore(agents): update AGENTS.md from AnkiQuest-Agents"
          failed=0

          for repo in $(jq -r '.[]' <<<"$TARGETS"); do
            branch=$(gh api "repos/$repo" --jq .default_branch)
            section="source/repos/${repo#*/}.md"
            if [ ! -f "$section" ]; then
              echo "::error::$repo has no $section"; failed=1; continue
            fi

            # Only AGENTS.md is needed: a shallow, sparse, blob-less clone
            dir="work/${repo#*/}"
            git clone -q --depth 1 --filter=blob:none --sparse -b "$branch" "https://github.com/$repo.git" "$dir"
            git -C "$dir" sparse-checkout set --no-cone /AGENTS.md

            # The fork's upstream guidance stays as the branch has it; the sync job updates it
            fork-sync agents source/shared.md "$section" keep "$dir/AGENTS.md" > agents.md
            echo "@AGENTS.md" > claude.md
            echo "Generated from AnkiQuest/AnkiQuest-Agents $source_sha. Change the rules there, not here: shared.md for all repositories, repos/${repo#*/}.md for this one.

          AnkiQuest-Sync pushes these updates to $branch directly. It opened this pull request because the push was refused; it merges by itself once its checks pass." > body.md

            source-watch land "$repo" agents-sync "$title" \
              "Generated from AnkiQuest/AnkiQuest-Agents $source_sha: shared.md and repos/${repo#*/}.md." \
              body.md "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/land" \
              AGENTS.md=agents.md CLAUDE.md=claude.md || failed=1
          done

          exit $failed
